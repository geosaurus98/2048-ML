[project]
name = "game2048"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "numba", "gymnasium", "torch", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game2048", "src/tetris"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# n-tuple tests write 268 MB checkpoints; keep tmp dirs only for failed tests
tmp_path_retention_policy = "failed"
